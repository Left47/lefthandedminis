<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Left-Handed Minis</title>
<meta name="description" content="Painted miniatures, game nights, and match reports from Left-Handed Minis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15120f; --surface:#1f1a16; --line:#342c25; --text:#f3ece3; --muted:#a89a8b;
    --accent:#e0a93a; --accent-ink:#1a1206; --win:#7fc98a; --loss:#e27a6f; --draw:#c9b77f;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,sans-serif}
  a{color:inherit}
  header{padding:48px 16px 24px;max-width:1120px;margin:0 auto}
  .kicker{color:var(--accent);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(36px,8vw,64px);line-height:1;margin:10px 0 12px;letter-spacing:-.02em}
  header p{color:var(--muted);max-width:52ch;margin:0}
  header nav{margin-top:18px;display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
  header nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
  header nav a:hover{color:var(--text);border-color:var(--accent)}
  .filters{max-width:1120px;margin:0 auto;padding:0 16px 20px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font:500 13px Inter,sans-serif;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  main{max-width:1120px;margin:0 auto;padding:0 16px 64px;display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .15s,border-color .15s}
  .card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card .img{aspect-ratio:4/5;position:relative;background:#000}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);font-size:12px;padding:3px 8px;border-radius:999px}
  .meta{padding:12px 14px 14px}
  .meta h2{font:700 17px/1.25 "Bricolage Grotesque",sans-serif;margin:0 0 6px}
  .sub{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
  .res{font-weight:600;padding:1px 8px;border-radius:6px;font-size:12px;color:#111}
  .res.W{background:var(--win)} .res.L{background:var(--loss)} .res.D{background:var(--draw)}
  .empty{color:var(--muted)}
  /* viewer */
  dialog{border:0;padding:0;background:var(--bg);color:var(--text);width:min(1000px,100vw);max-width:100vw;max-height:100dvh;height:100dvh;margin:auto}
  @media(min-width:760px){dialog{height:auto;max-height:92vh;border-radius:18px;border:1px solid var(--line)}}
  dialog::backdrop{background:rgba(0,0,0,.8)}
  .viewer{display:grid;grid-template-columns:1fr;height:100%;overflow:auto}
  @media(min-width:760px){.viewer{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);max-height:92vh}}
  .slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#000;scrollbar-width:none}
  .slides::-webkit-scrollbar{display:none}
  .slides img{flex:0 0 100%;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center}
  .dots{display:flex;gap:6px;justify-content:center;padding:10px 0;background:#000}
  .dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:#555;cursor:pointer}
  .dots button[aria-current="true"]{background:var(--accent)}
  .side{padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px;min-width:0}
  @media(min-width:760px){.side{overflow:auto}}
  .side h2{font:800 24px/1.15 "Bricolage Grotesque",sans-serif;margin:0}
  .tabs{display:flex;gap:6px}
  .caption{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px}
  .caption .tag{color:var(--accent)}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:7px 12px;font:500 13px Inter,sans-serif;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .close{position:absolute;top:10px;left:10px;z-index:2;background:rgba(0,0,0,.6);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 40px}
</style>
</head>
<body>
<header>
  <div class="kicker">Left-Handed Minis</div>
  <h1>From the hobby table</h1>
  <p>Painted miniatures, game nights, and Blood Bowl match reports. Perfection optional.</p>
  <nav>
    <a href="https://instagram.com/lefthandedminis" rel="noopener">Instagram</a>
    <a href="https://www.threads.net/@lefthandedminis" rel="noopener">Threads</a>
  </nav>
</header>
<div class="filters" id="filters" role="group" aria-label="Filter posts"></div>
<main id="grid" aria-live="polite"><p class="empty">Loading posts…</p></main>
<footer>Photos &amp; words by Left-Handed Minis</footer>

<dialog id="viewer" aria-label="Post viewer">
  <button class="close" id="close" aria-label="Close">×</button>
  <div class="viewer">
    <div><div class="slides" id="slides"></div><div class="dots" id="dots"></div></div>
    <div class="side">
      <div>
        <div class="sub" id="vsub"></div>
        <h2 id="vtitle"></h2>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="caption" id="caption"></div>
      <div class="row"><span id="chars"></span><button class="btn" id="copy">Copy caption</button></div>
    </div>
  </div>
</dialog>

<script>
const posts = [];
let filter = 'All';
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const resClass = r => (r||'').trim().charAt(0).toUpperCase();

async function load(){
  try{
    const slugs = await (await fetch('posts/index.json',{cache:'no-cache'})).json();
    for (const slug of slugs){
      const base = 'posts/' + slug + '/';
      const p = await (await fetch(base + 'post.json',{cache:'no-cache'})).json();
      p.base = base; p.caps = {};
      for (const [k,f] of Object.entries(p.captions||{})){
        try{ p.caps[k] = (await (await fetch(base + f,{cache:'no-cache'})).text()).trim(); }catch(e){}
      }
      posts.push(p);
    }
    posts.sort((a,b)=> b.date.localeCompare(a.date));
    renderFilters(); render();
  }catch(e){
    document.getElementById('grid').innerHTML = '<p class="empty">Couldn\'t load posts.</p>';
  }
}
function renderFilters(){
  const games = ['All', ...new Set(posts.map(p=>p.game).filter(Boolean))];
  const el = document.getElementById('filters');
  el.innerHTML = games.length > 2 ? games.map(g=>`<button class="chip" aria-pressed="${g===filter}">${esc(g)}</button>`).join('') : '';
  el.querySelectorAll('.chip').forEach(b=> b.onclick = ()=>{ filter=b.textContent; renderFilters(); render(); });
}
function render(){
  const list = posts.filter(p=> filter==='All' || p.game===filter);
  const grid = document.getElementById('grid');
  if(!list.length){ grid.innerHTML = '<p class="empty">No posts yet.</p>'; return; }
  grid.innerHTML = list.map((p,i)=>`
    <button class="card" data-i="${posts.indexOf(p)}" aria-label="Open ${esc(p.title)}">
      <div class="img"><img loading="lazy" src="${p.base + p.images[0].file}" alt="${esc(p.images[0].alt||'')}">
        ${p.images.length>1?`<span class="count">1/${p.images.length}</span>`:''}</div>
      <div class="meta"><h2>${esc(p.title)}</h2>
        <div class="sub">${p.result?`<span class="res ${resClass(p.result)}">${esc(p.result)}</span>`:''}<span>${esc(p.game||'')}</span><span>·</span><span>${fmtDate(p.date)}</span></div>
      </div>
    </button>`).join('');
  grid.querySelectorAll('.card').forEach(c=> c.onclick = ()=> open(posts[+c.dataset.i]));
}
function highlight(t){
  return esc(t).replace(/(^|\s)([#@][\w.]+)/g,'$1<span class="tag">$2</span>');
}
function open(p){
  const slides = document.getElementById('slides'), dots = document.getElementById('dots');
  slides.innerHTML = p.images.map(im=>`<img src="${p.base+im.file}" alt="${esc(im.alt||'')}">`).join('');
  dots.innerHTML = p.images.length>1 ? p.images.map((_,i)=>`<button aria-label="Photo ${i+1}" aria-current="${i===0}"></button>`).join('') : '';
  dots.querySelectorAll('button').forEach((b,i)=> b.onclick = ()=> slides.scrollTo({left:i*slides.clientWidth,behavior:'smooth'}));
  slides.onscroll = ()=>{ const i=Math.round(slides.scrollLeft/slides.clientWidth); dots.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-current', j===i)); };
  document.getElementById('vtitle').textContent = p.title;
  document.getElementById('vsub').innerHTML = [p.result?`<span class="res ${resClass(p.result)}">${esc(p.result)}</span>`:'', esc(p.league||p.game||''), fmtDate(p.date)].filter(Boolean).join(' <span>·</span> ');
  const keys = Object.keys(p.caps), tabs = document.getElementById('tabs');
  const show = k => {
    tabs.querySelectorAll('.chip').forEach(b=> b.setAttribute('aria-pressed', b.dataset.k===k));
    document.getElementById('caption').innerHTML = highlight(p.caps[k]||'');
    document.getElementById('chars').textContent = (p.caps[k]||'').length + ' characters';
    document.getElementById('copy').onclick = async e => { try{ await navigator.clipboard.writeText(p.caps[k]); e.target.textContent='Copied'; setTimeout(()=>e.target.textContent='Copy caption',1400);}catch(_){} };
  };
  tabs.innerHTML = keys.map(k=>`<button class="chip" data-k="${k}">${({instagram:'Instagram',threads:'Threads',tiktok:'TikTok',bluesky:'Bluesky'})[k]||k}</button>`).join('');
  tabs.querySelectorAll('.chip').forEach(b=> b.onclick = ()=> show(b.dataset.k));
  if(keys.length) show(keys[0]);
  const d = document.getElementById('viewer'); d.showModal(); slides.scrollLeft = 0;
}
document.getElementById('close').onclick = ()=> document.getElementById('viewer').close();
document.getElementById('viewer').addEventListener('click', e=>{ if(e.target.id==='viewer') e.target.close(); });
load();
</script>
</body>
</html>
