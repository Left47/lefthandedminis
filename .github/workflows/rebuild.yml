name: Rebuild gallery

# Publishes posts marked "hold": true once their go-live time passes.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-gallery
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow markdown
      - run: python build.py
      - name: Commit if a held post went live
        run: |
          git add -A
          # The sitemap's lastmod changes daily on its own; only commit when something else changed.
          if git diff --cached --quiet -- . ':(exclude)sitemap.xml'; then
            echo "Nothing new to publish."
            exit 0
          fi
          git -c user.name=Left47 -c user.email=Left47@users.noreply.github.com commit -m "Publish scheduled posts"
          git pull --rebase origin main
          git push origin HEAD:main
